[package]
name = "continuum"
version = "0.1.0"
edition = "2021"
authors = ["Continuum Developer"]
description = "A minimal, high-performance GTK4/Adwaita Manhwa comic reader (.cbz) with continuous lazy loading and seamless multi-archive scrolling."
default-run = "continuum"

[dependencies]
qmetaobject = "0.2.10"
cpp = "0.5"

zip = "2.2"
image = { version = "0.25.10", features = ["png", "jpeg", "webp", "gif", "bmp"] }
natord = "1.0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cpp_build = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
